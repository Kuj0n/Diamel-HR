<!doctype html>
<html lang="pl" data-motyw="ciemny">
<head>
<meta charset="utf-8">
<title>Korektor Logów HR</title>
<link rel="stylesheet" href="styl.css">
</head>
<body>

<!-- Start: sprawdzanie aktualizacji i logowanie do bazy pracowników -->
<div class="ekran-start" id="ekran-start">
  <div class="logowanie">
    <div class="marka"><img src="logo.png" alt=""><div>Korektor Logów HR<small id="start-wersja">DIAMEL</small></div></div>
    <div id="start-aktualizacja"></div>
    <div class="karta" id="start-tresc"><div class="ladowanie"></div><div class="podp" style="text-align:center">Łączenie z serwerem…</div></div>
  </div>
</div>

<div class="okno">
  <aside class="boczne">
    <div class="marka"><img src="logo.png" alt=""><div>Korektor HR<small id="boczne-wersja">DIAMEL</small></div></div>
    <button class="poz akt" data-widok="pulpit"><svg class="ik" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Korekta logów<span class="licznik ukryty" id="licznik-pulpit"></span></button>
    <button class="poz" data-widok="reguly"><svg class="ik" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="16" r="3"/></svg>Reguły korekty<span class="licznik zolty ukryty" id="licznik-reguly"></span></button>
    <button class="poz" data-widok="historia"><svg class="ik" viewBox="0 0 24 24"><path d="M12 8v4l3 2M3 12a9 9 0 1 0 3-6.7M3 4v4h4"/></svg>Historia</button>
    <button class="poz" data-widok="ustawienia"><svg class="ik" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>Ustawienia</button>
    <button class="poz" data-widok="zglos"><svg class="ik" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>Zgłoś błąd</button>
    <div class="dol">
      <div id="dol-konto">Bez logowania</div>
      <div id="dol-baza"></div>
      <div id="dol-wersja"></div>
      <div class="motyw" id="motyw">
        <button data-motyw="jasny" title="Jasny"><svg class="ik" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Jasny</button>
        <button data-motyw="ciemny" title="Ciemny"><svg class="ik" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>Ciemny</button>
        <button data-motyw="system" title="Jak w Windows"><svg class="ik" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>System</button>
      </div>
    </div>
  </aside>

  <main class="glowna" id="glowna">
    <div class="pasek">
      <div><span class="eyebrow" id="pasek-nad">Korektor Logów HR</span><h1 id="pasek-tytul">Korekta logów czasu pracy</h1></div>
      <div class="prawe" id="pasek-prawe"></div>
    </div>
    <section class="widok" id="widok-pulpit"></section>
    <section class="widok ukryty" id="widok-reguly"></section>
    <section class="widok ukryty" id="widok-historia"></section>
    <section class="widok ukryty" id="widok-ustawienia"></section>
    <section class="widok ukryty" id="widok-zglos"></section>
    <div id="szuflada-miejsce"></div>
  </main>
</div>

<div class="powiadomienia" id="powiadomienia"></div>
<div id="modal-miejsce"></div>
<div class="nakladka-upusc ukryty" id="nakladka-upusc">Upuść plik RCP (.txt) albo plan nieobecności (.xls)</div>

<script src="app.js"></script>
</body>
</html>
